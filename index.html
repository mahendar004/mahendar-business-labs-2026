<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Labs - Student Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script>
const KEY="bl_students_v1", SESSION="bl_session_v1";
const app=document.getElementById("app");
const load=()=>JSON.parse(localStorage.getItem(KEY)||"[]");
const save=x=>localStorage.setItem(KEY,JSON.stringify(x));
const session=()=>JSON.parse(localStorage.getItem(SESSION)||"null");
const setSession=x=>x?localStorage.setItem(SESSION,JSON.stringify(x)):localStorage.removeItem(SESSION);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const age=dob=>{if(!dob)return "";let d=new Date(dob),n=new Date(),a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()==d.getMonth()&&n.getDate()<d.getDate()))a--;return a};
function seed(){let s=load();if(!s.length){s=[{id:1,name:"Demo Student",email:"student@demo.com",password:"Student@123",dob:"2003-05-10",gender:"Male",qualification:"B.Tech",interests:["Coding","Sports"],className:"Final Year",subject:"Data Science",marks:"85",aadhaar:"demo_aadhaar.pdf",role:"student"}];save(s)}} seed();

function layout(title,content){app.innerHTML=`<div class="top"><b>BUSINESS LABS</b><span>${title}</span><button class="link" onclick="logout()">Logout</button></div><main>${content}</main>`}
function logout(){setSession(null);renderLogin()}
function renderLogin(msg=""){app.innerHTML=`<div class="card auth"><h1>Student Portal</h1><p class="muted">Unified Login</p>${msg?`<div class="msg">${esc(msg)}</div>`:""}<form onsubmit="login(event)"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button>Login</button></form><p><a href="#" onclick="renderRegister()">Create Student Account</a> · <a href="#" onclick="renderForgot()">Forgot Password?</a></p><hr><small>Demo admin: admin@businesslabs.com / Admin@123<br>Demo student: student@demo.com / Student@123</small></div>`}
function login(e){e.preventDefault();let s=load(),u=s.find(x=>x.email.toLowerCase()==email.value.toLowerCase()&&x.password===password.value);if(!u&&email.value==="admin@businesslabs.com"&&password.value==="Admin@123"){u={id:0,name:"Administrator",email:email.value,role:"admin"}}if(!u)return renderLogin("Invalid email or password.");setSession(u);u.role==="admin"?renderAdmin():renderStudent(u.id)}
function renderRegister(msg=""){app.innerHTML=`<div class="card wide"><h1>Student Registration</h1>${msg?`<div class="msg">${esc(msg)}</div>`:""}<form onsubmit="register(event)" enctype="multipart/form-data"><div class="grid">
<label>Name<input id="rname" required></label><label>Email<input id="remail" type="email" required></label>
<label>Password<input id="rpass" type="password" minlength="6" required></label><label>Date of Birth<input id="rdob" type="date" required></label>
<label>Gender<div class="radio"><label><input type="radio" name="gender" value="Male" required> Male</label><label><input type="radio" name="gender" value="Female"> Female</label><label><input type="radio" name="gender" value="Other"> Other</label></div></label>
<label>Qualification<select id="rqual" required><option value="">Select</option><option>B.Tech</option><option>B.E</option><option>MCA</option><option>BCA</option><option>B.Sc</option><option>M.Tech</option></select></label>
<label>Class<input id="rclass" required></label><label>Subject<input id="rsub" required></label><label>Marks<input id="rmarks" type="number" min="0" max="100" required></label>
<label>Interests<div class="checks"><label><input type="checkbox" name="interest" value="Coding"> Coding</label><label><input type="checkbox" name="interest" value="Sports"> Sports</label><label><input type="checkbox" name="interest" value="Reading"> Reading</label><label><input type="checkbox" name="interest" value="Music"> Music</label></div></label>
<label>Aadhaar (PDF only)<input id="raadhaar" type="file" accept=".pdf,application/pdf" required></label>
</div><button>Register</button></form><p><a href="#" onclick="renderLogin()">Back to Login</a></p></div>`}
function register(e){e.preventDefault();let s=load(),email=remail.value.trim().toLowerCase();if(s.some(x=>x.email.toLowerCase()===email))return renderRegister("This email is already registered.");let f=raadhaar.files[0];if(!f||f.type!=="application/pdf"&&!f.name.toLowerCase().endsWith(".pdf"))return renderRegister("Aadhaar must be a PDF file.");if(f.size>5*1024*1024)return renderRegister("Aadhaar PDF must be 5 MB or smaller.");let interests=[...document.querySelectorAll('input[name="interest"]:checked')].map(x=>x.value);let id=s.length?Math.max(...s.map(x=>x.id))+1:1;let unique="aadhaar_"+crypto.randomUUID()+"_"+Date.now()+".pdf";s.push({id,name:rname.value.trim(),email,password:rpass.value,dob:rdob.value,gender:document.querySelector('input[name="gender"]:checked').value,qualification:rqual.value,interests,className:rclass.value.trim(),subject:rsub.value.trim(),marks:rmarks.value,aadhaar:unique,originalAadhaar:f.name,role:"student"});save(s);renderLogin("Registration successful. Please login.");}
function renderForgot(msg=""){app.innerHTML=`<div class="card auth"><h1>Forgot Password</h1>${msg?`<div class="msg">${esc(msg)}</div>`:""}<form onsubmit="forgot(event)"><label>Email</label><input id="femail" type="email" required><button>Generate Reset</button></form><p><a href="#" onclick="renderLogin()">Back to Login</a></p></div>`}
function forgot(e){e.preventDefault();let u=load().find(x=>x.email.toLowerCase()===femail.value.toLowerCase());if(!u)return renderForgot("No account found for this email.");renderReset(u.id)}
function renderReset(id,msg=""){app.innerHTML=`<div class="card auth"><h1>Reset Password</h1>${msg?`<div class="msg">${esc(msg)}</div>`:""}<form onsubmit="resetPass(event,${id})"><label>New Password<input id="newpass" type="password" minlength="6" required></label><button>Reset Password</button></form></div>`}
function resetPass(e,id){e.preventDefault();let s=load(),u=s.find(x=>x.id===id);u.password=newpass.value;save(s);renderLogin("Password reset successfully.");}
function guard(role){let x=session();if(!x){renderLogin();return null}if(role&&x.role!==role){alert("Access denied.");x.role==="admin"?renderAdmin():renderStudent(x.id);return null}return x}
function renderAdmin(){if(!guard("admin"))return;let s=load();layout("Admin Dashboard",`<div class="card"><h2>Admin Dashboard</h2><div class="filters"><input id="fname" placeholder="Filter by Name" oninput="filterAdmin()"><input id="fclass" placeholder="Filter by Class" oninput="filterAdmin()"><input id="minage" type="number" placeholder="Min Age" oninput="filterAdmin()"><input id="maxage" type="number" placeholder="Max Age" oninput="filterAdmin()"></div><div id="atable"></div></div>`);drawTable(s)}
function drawTable(s){atable.innerHTML=`<div class="tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Age</th><th>Class</th><th>Subject</th><th>Marks</th><th>Aadhaar</th><th>Actions</th></tr></thead><tbody>${s.map(u=>`<tr><td>#${u.id}</td><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${age(u.dob)}</td><td>${esc(u.className)}</td><td>${esc(u.subject)}</td><td>${esc(u.marks)}</td><td><button class="small" onclick="viewAadhaar(${u.id})">${esc(u.aadhaar)}</button></td><td><button class="small" onclick="editAdmin(${u.id})">Edit</button> <button class="small danger" onclick="delUser(${u.id})">Delete</button></td></tr>`).join("")||`<tr><td colspan="9">No students found.</td></tr>`}</tbody></table></div>`}
function filterAdmin(){let s=load(),n=(fname.value||"").toLowerCase(),c=(fclass.value||"").toLowerCase(),mi=+minage.value||0,ma=+maxage.value||999;s=s.filter(u=>(!n||u.name.toLowerCase().includes(n))&&(!c||u.className.toLowerCase().includes(c))&&age(u.dob)>=mi&&age(u.dob)<=ma);drawTable(s)}
function viewAadhaar(id){let u=load().find(x=>x.id===id);alert("Aadhaar PDF (simulation)\\n\\nUnique stored filename: "+u.aadhaar+"\\nOriginal filename: "+(u.originalAadhaar||u.aadhaar)+"\\nPDF validation: Passed");}
function delUser(id){if(!confirm("Delete this student?"))return;save(load().filter(x=>x.id!==id));renderAdmin()}
function editAdmin(id){let u=load().find(x=>x.id===id);app.innerHTML=`<div class="card wide"><h2>Edit Student #${id}</h2><div class="locked">Name and Email are locked in admin edit.</div><form onsubmit="saveAdmin(event,${id})"><div class="grid"><label>Name<input value="${esc(u.name)}" disabled></label><label>Email<input value="${esc(u.email)}" disabled></label><label>DOB<input id="edob" type="date" value="${u.dob}" required></label><label>Gender<select id="egender"><option ${u.gender=="Male"?"selected":""}>Male</option><option ${u.gender=="Female"?"selected":""}>Female</option><option ${u.gender=="Other"?"selected":""}>Other</option></select></label><label>Qualification<input id="equal" value="${esc(u.qualification)}" required></label><label>Class<input id="eclass" value="${esc(u.className)}" required></label><label>Subject<input id="esub" value="${esc(u.subject)}" required></label><label>Marks<input id="emarks" type="number" value="${esc(u.marks)}" min="0" max="100" required></label><label>Replace Aadhaar PDF<input id="eaad" type="file" accept=".pdf,application/pdf"></label></div><button>Save Changes</button> <button type="button" class="secondary" onclick="renderAdmin()">Cancel</button></form></div>`}
function saveAdmin(e,id){e.preventDefault();let s=load(),u=s.find(x=>x.id===id);u.dob=edob.value;u.gender=egender.value;u.qualification=equal.value;u.className=eclass.value;u.subject=esub.value;u.marks=emarks.value;let f=eaad.files[0];if(f){if(f.type!=="application/pdf"&&!f.name.toLowerCase().endsWith(".pdf"))return alert("Aadhaar must be a PDF.");u.aadhaar="aadhaar_"+crypto.randomUUID()+"_"+Date.now()+".pdf";u.originalAadhaar=f.name}save(s);renderAdmin()}
function renderStudent(id){let u=load().find(x=>x.id===id);if(!guard("student")||!u)return;layout("Student Dashboard",`<div class="card"><h2>Welcome, ${esc(u.name)} (User ID: #${u.id})</h2><div class="details">${Object.entries({Name:u.name,"Email":u.email,"Date of Birth":u.dob,"Age":age(u.dob),Gender:u.gender,Qualification:u.qualification,Interests:u.interests.join(", ")||"None",Class:u.className,Subject:u.subject,Marks:u.marks+"%",Aadhaar:u.aadhaar}).map(([k,v])=>`<div><b>${k}</b><span>${esc(v)}</span></div>`).join("")}</div><button onclick="editProfile(${u.id})">Edit Profile</button></div>`)}
function editProfile(id){let u=load().find(x=>x.id===id);app.innerHTML=`<div class="card wide"><h2>Edit Profile</h2><div class="locked">Email cannot be changed. Name is also locked.</div><form onsubmit="saveProfile(event,${id})"><div class="grid"><label>Name<input value="${esc(u.name)}" disabled></label><label>Email<input value="${esc(u.email)}" disabled></label><label>DOB<input id="pdob" type="date" value="${u.dob}" required></label><label>Gender<input id="pgender" value="${esc(u.gender)}" required></label><label>Qualification<input id="pqual" value="${esc(u.qualification)}" required></label><label>Class<input id="pclass" value="${esc(u.className)}" required></label><label>Subject<input id="psub" value="${esc(u.subject)}" required></label><label>Marks<input id="pmarks" type="number" value="${esc(u.marks)}" min="0" max="100" required></label><label>Replace Aadhaar PDF<input id="paad" type="file" accept=".pdf,application/pdf"></label></div><button>Save Profile</button> <button type="button" class="secondary" onclick="renderStudent(${id})">Cancel</button></form></div>`}
function saveProfile(e,id){e.preventDefault();let s=load(),u=s.find(x=>x.id===id);u.dob=pdob.value;u.gender=pgender.value;u.qualification=pqual.value;u.className=pclass.value;u.subject=psub.value;u.marks=pmarks.value;let f=paad.files[0];if(f){if(f.type!=="application/pdf"&&!f.name.toLowerCase().endsWith(".pdf"))return alert("Aadhaar must be a PDF.");u.aadhaar="aadhaar_"+crypto.randomUUID()+"_"+Date.now()+".pdf";u.originalAadhaar=f.name}save(s);renderStudent(id)}
renderLogin();
</script>
</body>
</html>
